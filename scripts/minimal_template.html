<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Browse PAIR_COUNT mathematical image pairs, their English labels, and original source images.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Mathematical Visual Perception · Dataset</title>
<style>
:root{color-scheme:light;--ink:#20252b;--muted:#65717b;--line:#e2e7eb;--accent:#205d81;--wash:#f6f8fa}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:14px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}a:focus-visible,button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.wrap{max-width:1440px;margin:auto;padding:0 28px}header{padding-top:29px;padding-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:25px;line-height:1.3;letter-spacing:-.025em;font-weight:650;margin:0 0 5px}.dataset-meta{color:var(--muted);font-size:13px;margin:0}.downloads{display:flex;gap:17px;flex-wrap:wrap;font-size:13px;white-space:nowrap}.filter-panel{position:sticky;top:0;z-index:3;background:#fffffff5;backdrop-filter:blur(8px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0;display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1.35fr;gap:10px}select,input,button{font:inherit;border:1px solid #d6dee4;border-radius:5px;background:#fff;color:var(--ink);padding:8px 10px;min-width:0}select,input{width:100%;font-size:13px}input::placeholder{color:#76838d}.result-bar{display:flex;justify-content:space-between;align-items:center;padding:13px 0;color:var(--muted);font-size:13px}#count{font-weight:600}.pager{display:flex;align-items:center;gap:12px}.pager button{font-size:13px;padding:5px 12px;cursor:pointer}.pager button:hover:enabled{background:var(--wash)}.pager button:disabled{opacity:.35;cursor:default}#page-status{min-width:62px;text-align:center}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}article{min-width:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;padding:17px 18px 6px}article[hidden]{display:none!important}article h2{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:15px;margin:0;font-weight:650;letter-spacing:.01em}article h2 span{font-size:12px;letter-spacing:0;color:var(--muted);font-weight:400;text-align:right}.meta{font-size:12px;line-height:1.65;color:var(--muted);margin:5px 0 12px}.preview{display:block;background:#edf1f5;border-radius:3px;overflow:hidden}.preview img{display:block;width:100%;height:auto;aspect-ratio:1240/690;object-fit:contain}.target{font-size:13px;line-height:1.65;margin:13px 0 0}.target b{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.035em;text-transform:uppercase;margin-bottom:2px}summary{font-size:13px;color:var(--accent);cursor:pointer;padding:11px 0}details{border-top:1px solid var(--line);margin-top:12px}details p{font-size:13px;margin:10px 0 12px}details h3{font-size:13px;margin:14px 0 0}details h3+p{margin-top:4px}.judgment{font-weight:650}.evidence,.files{color:var(--muted)}.files{line-height:1.9}.bottom-pager{justify-content:flex-end;border-top:1px solid var(--line);margin-top:24px;padding-top:18px;padding-bottom:18px}#empty{color:var(--muted);padding:50px 0;text-align:center}footer{margin-top:10px;border-top:1px solid var(--line);padding:18px 0 28px;color:var(--muted);font-size:12px}footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}footer a{color:var(--muted)}.noscript{padding:12px;background:var(--wash);color:var(--muted)}code{font-size:12px}
@media(max-width:1100px){header{align-items:flex-start;flex-direction:column;gap:14px}.filter-panel{grid-template-columns:repeat(4,1fr)}.filter-panel input{grid-column:1/-1}.gallery{grid-template-columns:1fr}}
@media(max-width:600px){.wrap{padding-left:16px;padding-right:16px}header{padding-top:22px;padding-bottom:17px}h1{font-size:22px}.downloads{gap:15px}.filter-panel{grid-template-columns:1fr 1fr;position:relative;backdrop-filter:none;gap:8px}select,input{font-size:12px}.result-bar{gap:10px;align-items:flex-start}.pager{gap:7px}.pager button{padding:4px 8px;font-size:12px}.gallery{gap:16px}article{padding:14px 13px 4px}article h2{gap:8px}article h2 span{font-size:11px}.target{font-size:13px}.bottom-pager{justify-content:flex-end}footer .wrap{display:block}footer .wrap span{display:block;margin-bottom:6px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.pair-images{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;height:280px}.image-panel{min-width:0;display:flex;flex-direction:column;background:#fff;padding:9px 10px 12px;gap:8px}.image-panel span{font-size:10px;color:var(--muted);line-height:1}.image-panel img{display:block;min-height:0;width:100%;height:100%;object-fit:contain}.image-panel:hover{background:#fafcfd;text-decoration:none}@media(max-width:600px){.pair-images{height:250px}.image-panel{padding:8px;gap:6px}}
.pair-images{grid-template-rows:minmax(0,1fr)}.image-panel{min-height:0;overflow:hidden}.image-panel span{flex:none}.image-panel img{height:0;flex:1 1 0}
</style>
</head>
<body>
<header class="wrap">
  <div><h1>Mathematical Visual Perception</h1><p class="dataset-meta">PAIR_COUNT image pairs · 4 conditions · vRELEASE_VERSION</p></div>
  <nav class="downloads" aria-label="Dataset downloads"><a href="annotations.json" download>Annotations</a><a href="labels.jsonl" download>Labels</a><a href="pairs_summary.csv" download>CSV</a><a href="https://github.com/jayboynana/advanced-math-visual-perception" target="_blank" rel="noopener">GitHub ↗</a></nav>
</header>
<main class="wrap" id="dataset">
<form class="filter-panel" aria-label="Dataset filters" onsubmit="return false">
  <select id="type" aria-label="Image type"><option value="">All image types</option><option value="same type">Same type</option><option value="different type">Different types</option></select>
  <select id="dataset-source" aria-label="Source dataset"><option value="">All sources</option><!-- SOURCE OPTIONS --></select>
  <select id="condition" aria-label="Condition"><option value="">All conditions</option><option value="numeric_representation">Numeric representation</option><option value="geometric_markers">Geometric markers</option><option value="symbolic_roles">Symbolic roles</option><option value="graphical_roles">Graphical roles</option></select>
  <select id="semantic" aria-label="Semantic judgment"><option value="">All meanings</option><option value="same_meaning">Same meaning</option><option value="different_meaning">Different meanings</option></select>
  <input type="search" id="search" placeholder="Search pairs or labels" aria-label="Search pairs or annotations">
</form>
<div class="result-bar"><span id="count" role="status" aria-live="polite">PAIR_COUNT pairs</span><nav class="pager" aria-label="Page navigation"><button type="button" data-page="previous" aria-label="Previous page">Previous</button><span id="page-status" aria-live="polite">1 / PAGE_COUNT</span><button type="button" data-page="next" aria-label="Next page">Next</button></nav></div>
<noscript><p class="noscript">All PAIR_COUNT pairs are listed below. Enable JavaScript for filtering, pagination, and images served from source archives.</p></noscript>
<div id="pair-list" class="gallery">
<!-- PAIRS -->
</div>
<p id="empty" hidden>No matching pairs.</p>
<nav class="pager bottom-pager" aria-label="More pages"><button type="button" data-page="previous" aria-label="Previous page">Previous</button><span id="page-status-bottom">1 / PAGE_COUNT</span><button type="button" data-page="next" aria-label="Next page">Next</button></nav>
</main>
<footer><div class="wrap"><span><!-- SOURCE LINKS --></span><span>Annotation draft · <a href="sources/SOURCE_REGISTRY.json">Source records</a></span></div></footer>
<script src="scripts/archive_images.js"></script>
<script>
const cards=[...document.querySelectorAll('article')];
const perPage=24;
const filters=['type','dataset-source','condition','semantic','search'].map(id=>document.getElementById(id));
const searchText=cards.map(card=>card.textContent.toLowerCase());
let matches=cards;
let page=1;
function render(){
  const pages=Math.max(1,Math.ceil(matches.length/perPage));
  page=Math.min(Math.max(1,page),pages);
  const visible=new Set(matches.slice((page-1)*perPage,page*perPage));
  cards.forEach(card=>{
    card.hidden=!visible.has(card);
    if(!card.hidden)loadArchiveImages(card);
  });
  document.getElementById('count').textContent=matches.length===cards.length?cards.length+' pairs':matches.length+' / '+cards.length+' pairs';
  document.getElementById('page-status').textContent=page+' / '+pages;
  document.getElementById('page-status-bottom').textContent=page+' / '+pages;
  document.querySelectorAll('[data-page="previous"]').forEach(button=>{button.disabled=page===1;});
  document.querySelectorAll('[data-page="next"]').forEach(button=>{button.disabled=page===pages;});
  document.getElementById('empty').hidden=matches.length!==0;
}
function filter(){
  const [type,source,condition,semantic,search]=filters.map(input=>input.value);
  const query=search.trim().toLowerCase();
  matches=cards.filter((card,index)=>(!type||card.dataset.type===type)&&(!source||card.dataset.datasets.split(' ').includes(source))&&(!condition||card.dataset.condition===condition)&&(!semantic||card.dataset.semantic===semantic)&&(!query||searchText[index].includes(query)));
  page=1;render();
}
filters.forEach(input=>input.addEventListener('input',filter));
document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{
  page+=button.dataset.page==='next'?1:-1;render();document.getElementById('dataset').scrollIntoView({block:'start'});
}));
render();
</script>
</body></html>
